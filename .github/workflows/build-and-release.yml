name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '[0-9]+.*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Build with Gradle
      run: ./gradlew build --no-daemon --stacktrace
      env:
        GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx3072m -XX:+HeapDumpOnOutOfMemoryError"'
    
    - name: Find JAR file
      id: find_jar
      run: |
        JAR_FILE=$(find build/libs/ -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -1)
        echo "JAR_PATH=$JAR_FILE" >> $GITHUB_OUTPUT
        echo "JAR_NAME=$(basename $JAR_FILE)" >> $GITHUB_OUTPUT
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: AmunRa-GC-${{ github.sha }}
        path: ${{ steps.find_jar.outputs.JAR_PATH }}
        retention-days: 30
    
    - name: Get version from tag
      if: startsWith(github.ref, 'refs/tags/')
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: AmunRa ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## AmunRa ${{ steps.get_version.outputs.VERSION }}
          
          A Minecraft 1.7.10 mod that extends Galacticraft with new planets, space stations, and advanced space technology.
          
          ### Installation
          1. Install Minecraft Forge 1.7.10 (10.13.4.1614+)
          2. Install Galacticraft 3.3.4+
          3. Place this JAR file in your mods folder
          
          ### Compatibility
          - Minecraft 1.7.10
          - Forge 10.13.4.1614+
          - Galacticraft 3.3.4+
        files: ${{ steps.find_jar.outputs.JAR_PATH }}
        draft: false
        prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'alpha') || contains(steps.get_version.outputs.VERSION, 'beta') || contains(steps.get_version.outputs.VERSION, 'rc') }}
        generate_release_notes: true